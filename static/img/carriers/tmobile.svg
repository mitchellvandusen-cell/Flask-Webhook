<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    T-Mobile logo — magenta T with two dots above the crossbar.
    Official brand color: #e20074 (T-Mobile magenta).
  -->
  <g fill="#e20074">
    <!-- Two square dots above crossbar -->
    <rect x="72" y="18" width="20" height="20" rx="3"/>
    <rect x="108" y="18" width="20" height="20" rx="3"/>
    <!-- T crossbar -->
    <rect x="38" y="50" width="124" height="28" rx="4"/>
    <!-- T vertical stem -->
    <rect x="78" y="50" width="44" height="132" rx="4"/>
  </g>
</svg>
