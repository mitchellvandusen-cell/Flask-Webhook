<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dark background -->
  <rect width="200" height="200" fill="#050505"/>

  <!-- Omnisconn circular logo -->
  <!-- Outer circle ring (gray) -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#999999" stroke-width="8"/>

  <!-- Top accent dots -->
  <!-- Left dot (black) -->
  <circle cx="75" cy="45" r="6" fill="#000000"/>

  <!-- Center dot (cyan) -->
  <circle cx="100" cy="38" r="6" fill="#00ffb3"/>

  <!-- Right dot (black) -->
  <circle cx="125" cy="45" r="6" fill="#000000"/>
</svg>
