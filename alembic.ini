# Alembic configuration for InsuranceGrokBot
#
# Usage:
#   alembic upgrade head          — Apply all pending migrations
#   alembic revision -m "desc"    — Create a new migration manually
#   alembic current               — Show current migration version
#   alembic history               — Show migration history

[alembic]
script_location = migrations
# Database URL is read from environment in migrations/env.py
# sqlalchemy.url is intentionally left empty here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
