<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #00ff88; --accent-dim: rgba(0,255,136,0.15); --bg: #030304; --bubble-user: #00ff88; --bubble-bot: #1a1a1f; --surface: #0d0d10; --border: #1e1e24; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; will-change: height, transform; }

        /* Ambient background glow */
        body::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at 30% 20%, rgba(0,255,136,0.03) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(0,100,255,0.02) 0%, transparent 50%); pointer-events: none; animation: ambientDrift 20s ease-in-out infinite alternate; }
        @keyframes ambientDrift { 0% { transform: translate(0,0); } 100% { transform: translate(-3%,2%); } }

        .container { display: flex; gap: 40px; width: 100%; max-width: 1440px; height: 100%; padding: 20px; align-items: center; justify-content: center; }

        /* Phone */
        .phone-wrapper { width: 100%; max-width: 400px; height: 95%; max-height: 860px; background: linear-gradient(145deg, #2a2a2e, #1a1a1e); border-radius: 55px; box-shadow: 0 0 0 2px rgba(255,255,255,0.06), 0 0 0 5px #111, 0 40px 80px rgba(0,0,0,0.7), 0 0 120px rgba(0,255,136,0.04); padding: 14px; position: relative; }
        .phone-wrapper::before { content: ''; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #000; border-radius: 0 0 18px 18px; z-index: 10; }
        .phone-screen { background: #000; width: 100%; height: 100%; border-radius: 44px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #1a1a1a; position: relative; }

        /* Status bar */
        .status-bar { padding: 18px 25px 10px; display: flex; justify-content: space-between; align-items: center; }
        .status-time { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
        .status-icons { display: flex; gap: 6px; align-items: center; }
        .status-icons i { font-size: 11px; color: #666; }

        /* Chat header */
        .chat-header { padding: 8px 20px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header-back { color: #fff; font-size: 18px; text-decoration: none; opacity: 0.5; transition: opacity 0.2s; display: flex; align-items: center; }
        .header-back:hover { opacity: 1; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #00cc66); display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .chat-header-info h4 { font-size: 0.875rem; font-weight: 700; margin: 0; line-height: 1.2; }
        .chat-header-info .online { font-size: 11px; color: var(--accent); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: livePulse 2s ease-in-out infinite; }
        @keyframes livePulse { 0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--accent); } 50% { opacity: 0.5; box-shadow: 0 0 8px var(--accent); } }

        /* Demo banner */
        .demo-banner { padding: 8px 20px; background: linear-gradient(90deg, rgba(0,255,136,0.04), rgba(0,255,136,0.08), rgba(0,255,136,0.04)); border-bottom: 1px solid rgba(0,255,136,0.08); font-size: 11px; color: #777; text-align: center; }

        /* Chat area */
        .chat-area { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; position: relative; }
        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* Messages */
        .msg-group { display: flex; flex-direction: column; gap: 2px; }
        .msg { max-width: 82%; padding: 11px 16px; font-size: 0.92rem; line-height: 1.45; animation: msgSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes msgSlide { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .msg.bot { align-self: flex-start; background: var(--bubble-bot); color: #e8e8e8; border-radius: 18px 18px 18px 6px; border: 1px solid rgba(255,255,255,0.04); }
        .msg.user { align-self: flex-end; background: var(--bubble-user); color: #000; border-radius: 18px 18px 6px 18px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,255,136,0.15); }
        .msg-meta { display: flex; align-items: center; gap: 5px; padding: 0 4px; }
        .msg-meta.bot-time { align-self: flex-start; }
        .msg-meta.user-time { align-self: flex-end; }
        .msg-time { font-size: 10px; color: #555; }
        .msg-check { font-size: 9px; color: var(--accent); }

        /* Typing indicator — inside chat area */
        .typing { display: none; gap: 5px; padding: 14px 18px; align-self: flex-start; background: var(--bubble-bot); border-radius: 18px 18px 18px 6px; border: 1px solid rgba(255,255,255,0.04); }
        .typing.active { display: flex; }
        .dot { width: 7px; height: 7px; background: #555; border-radius: 50%; animation: dotPulse 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.15s; } .dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        /* Scroll to bottom FAB */
        .scroll-fab { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%) scale(0); width: 36px; height: 36px; border-radius: 50%; background: rgba(30,30,36,0.95); border: 1px solid rgba(255,255,255,0.1); color: #aaa; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; transition: all 0.25s cubic-bezier(0.16,1,0.3,1); z-index: 5; backdrop-filter: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: none; }
        .scroll-fab.visible { transform: translateX(-50%) scale(1); pointer-events: auto; }
        .scroll-fab:hover { background: rgba(50,50,56,0.95); color: #fff; border-color: rgba(255,255,255,0.2); }

        /* Loading skeleton on init */
        .loading-skeleton { display: flex; flex-direction: column; gap: 12px; padding: 20px 0; }
        .skel-bubble { height: 42px; border-radius: 18px 18px 18px 6px; background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; align-self: flex-start; }
        .skel-bubble:nth-child(1) { width: 70%; }
        .skel-bubble:nth-child(2) { width: 55%; }
        .skel-bubble:nth-child(3) { width: 40%; align-self: flex-end; border-radius: 18px 18px 6px 18px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Input */
        .input-area { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 16px)) 16px; background: rgba(10,10,12,0.95); backdrop-filter: none; display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid rgba(255,255,255,0.04); }
        .input-field { flex: 1; background: #1a1a1f; border: 1px solid #2a2a30; border-radius: 22px; padding: 11px 16px; color: #fff; font-family: 'Outfit', sans-serif; font-size: 0.9rem; resize: none; max-height: 100px; min-height: 42px; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: rgba(0,255,136,0.3); }
        .input-field::placeholder { color: #444; }
        .send-btn { background: var(--accent); color: #000; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; transition: all 0.2s; box-shadow: 0 2px 12px rgba(0,255,136,0.2); flex-shrink: 0; }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 20px rgba(0,255,136,0.3); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Reset overlay */
        .reset-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); backdrop-filter: none; z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 20px; border-radius: 44px; }
        .reset-spinner { width: 40px; height: 40px; border: 3px solid rgba(0,255,136,0.12); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Custom confirm modal */
        .confirm-modal { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: none; z-index: 150; flex-direction: column; align-items: center; justify-content: center; border-radius: 44px; }
        .confirm-modal.active { display: flex; }
        .confirm-card { background: #1a1a1f; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 28px 24px; width: 85%; max-width: 300px; text-align: center; animation: modalSlide 0.3s cubic-bezier(0.16,1,0.3,1); }
        @keyframes modalSlide { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .confirm-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .confirm-card p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
        .confirm-btns { display: flex; gap: 10px; }
        .confirm-btns button { flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .btn-cancel { background: rgba(255,255,255,0.06); color: #aaa; border: 1px solid rgba(255,255,255,0.08) !important; }
        .btn-cancel:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-confirm { background: var(--accent); color: #000; }
        .btn-confirm:hover { box-shadow: 0 4px 20px rgba(0,255,136,0.3); transform: translateY(-1px); }

        /* ======= Terminal Panel ======= */
        .terminal-col { flex: 1; height: 95%; max-height: 860px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .terminal-header { padding: 16px 20px; background: linear-gradient(180deg, rgba(20,20,24,1), rgba(13,13,16,1)); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .terminal-title { display: flex; align-items: center; gap: 10px; }
        .terminal-title .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: livePulse 2s ease-in-out infinite; }
        .terminal-title span { color: #fff; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
        .session-id { font-family: 'JetBrains Mono'; font-size: 10px; color: #555; background: rgba(255,255,255,0.03); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.04); }

        .log-content { flex: 1; padding: 16px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #aaa; scroll-behavior: smooth; }
        .log-content::-webkit-scrollbar { width: 4px; }
        .log-content::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        .log-content::-webkit-scrollbar-thumb:hover { background: #333; }

        /* Log entries */
        .log-entry { margin-bottom: 12px; padding: 10px 12px; border-left: 3px solid #222; background: rgba(255,255,255,0.015); border-radius: 0 10px 10px 0; transition: background 0.2s; animation: logFadeIn 0.3s ease; }
        @keyframes logFadeIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
        .log-entry:hover { background: rgba(255,255,255,0.03); }
        .log-entry.user { border-left-color: var(--accent); background: rgba(0,255,136,0.02); }
        .log-entry.bot { border-left-color: #444; }
        .log-entry.facts { border-left-color: #ffaa00; background: rgba(255,170,0,0.03); }
        .log-entry.narrative { border-left-color: #00aaff; background: rgba(0,170,255,0.03); }
        .log-entry .log-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .log-entry .log-type { font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .log-entry.user .log-type { color: var(--accent); }
        .log-entry.bot .log-type { color: #666; }
        .log-entry.facts .log-type { color: #ffaa00; }
        .log-entry.narrative .log-type { color: #00aaff; }
        .log-entry .log-time { color: #444; font-size: 10px; }
        .log-entry .log-body { color: #999; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

        .terminal-footer { padding: 14px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .terminal-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #888; border-radius: 10px; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.75rem; font-weight: 500; transition: all 0.2s; letter-spacing: 0.3px; }
        .terminal-btn:hover { background: rgba(255,255,255,0.06); color: #fff; border-color: rgba(255,255,255,0.1); }

        /* Mobile */
        @media (max-width: 900px) {
            body::before { display: none; }
            .container { padding: 0; }
            .terminal-col { display: none; }
            .phone-wrapper { max-width: none; height: 100%; max-height: none; border-radius: 0; padding: 0; box-shadow: none; background: #000; }
            .phone-wrapper::before { display: none; }
            .phone-screen { border-radius: 0; border: none; }
            .reset-overlay { border-radius: 0; }
            .confirm-modal { border-radius: 0; }
            .status-bar { padding-top: calc(15px + env(safe-area-inset-top, 20px)); }

            /* Wider bubbles on small screens */
            .msg { max-width: 88%; }

            /* Prevent iOS auto-zoom on input focus */
            .input-field { font-size: 16px; }

            /* Bigger touch targets */
            .header-back { font-size: 20px; padding: 8px; margin: -8px; opacity: 0.7; }
            .scroll-fab { width: 42px; height: 42px; font-size: 0.875rem; bottom: 12px; }
            .send-btn { width: 46px; height: 46px; font-size: 16px; }

            /* Mobile reset button in header */
            .mobile-reset { display: flex; margin-left: auto; background: none; border: 1px solid rgba(255,255,255,0.08); color: #777; width: 34px; height: 34px; border-radius: 50%; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
            .mobile-reset:active { background: rgba(255,255,255,0.06); color: #fff; }
        }

        /* Hide mobile reset on desktop */
        @media (min-width: 901px) {
            .mobile-reset { display: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="phone-wrapper">
        <div class="phone-screen">
            <div class="status-bar">
                <span class="status-time" id="clock">--:--</span>
                <div class="status-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
            </div>
            <div class="chat-header">
                <a href="/" class="header-back" aria-label="Back to home"><i class="fa-solid fa-chevron-left"></i></a>
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="chat-header-info">
                    <h4>GrokBot</h4>
                    <div class="online"><div class="online-dot"></div> Active now</div>
                </div>
                <button class="mobile-reset" onclick="reset()" aria-label="Reset conversation"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="demo-banner">
                <span style="color: var(--accent); font-weight: 700;">DEMO</span> &mdash; In production, your bot uses the name you configure in your dashboard.
            </div>
            <div class="chat-area" id="chat">
                <div class="typing" id="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="scroll-fab" id="scrollFab" aria-label="Scroll to bottom"><i class="fa-solid fa-chevron-down"></i></div>
            </div>
            <div class="reset-overlay" id="resetOverlay">
                <div class="reset-spinner"></div>
                <div style="color:#fff; font-size:14px; font-weight:600;">Resetting session</div>
                <div style="color:#555; font-size:12px;">Generating new opener...</div>
            </div>
            <div class="confirm-modal" id="confirmModal">
                <div class="confirm-card">
                    <h3>Start over?</h3>
                    <p>This will clear the conversation and generate a fresh opener.</p>
                    <div class="confirm-btns">
                        <button class="btn-cancel" id="confirmCancel">Cancel</button>
                        <button class="btn-confirm" id="confirmOk">Reset</button>
                    </div>
                </div>
            </div>
            <div class="input-area">
                <textarea id="input" class="input-field" placeholder="Message..." rows="1" aria-label="Type a message"></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Send message"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <div class="terminal-col">
        <div class="terminal-header">
            <div class="terminal-title">
                <div class="live-dot"></div>
                <span>Live Brain Activity</span>
            </div>
            <span class="session-id" id="sessionDisplay">--</span>
        </div>
        <div class="log-content" id="logs">
            <div class="log-entry" style="border-left-color:#333;">
                <div class="log-body" style="color:#555;">> Initializing neural connection...</div>
            </div>
        </div>
        <div class="terminal-footer">
            <button onclick="reset()" class="terminal-btn"><i class="fa-solid fa-rotate-right" style="margin-right:6px;"></i>Reset</button>
            <a href="#" id="downloadLink" class="terminal-btn" target="_blank"><i class="fa-solid fa-download" style="margin-right:6px;"></i>Transcript</a>
        </div>
    </div>
</div>

<script>
(function() {
    let contactId = null;
    let sending = false;
    let isNearBottom = true;
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const typing = document.getElementById('typing');
    const logs = document.getElementById('logs');
    const sendBtn = document.getElementById('sendBtn');
    const scrollFab = document.getElementById('scrollFab');

    // ── Scroll tracking ──
    chat.addEventListener('scroll', () => {
        const threshold = 80;
        isNearBottom = (chat.scrollHeight - chat.scrollTop - chat.clientHeight) < threshold;
        scrollFab.classList.toggle('visible', !isNearBottom);
    });

    scrollFab.addEventListener('click', () => {
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    });

    function scrollToBottom() {
        requestAnimationFrame(() => {
            chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
        });
    }

    // ── Loading skeleton ──
    function showLoadingSkeleton() {
        const skel = document.createElement('div');
        skel.className = 'loading-skeleton';
        skel.id = 'initSkeleton';
        skel.innerHTML = '<div class="skel-bubble"></div><div class="skel-bubble"></div><div class="skel-bubble"></div>';
        chat.insertBefore(skel, typing);
    }

    function removeLoadingSkeleton() {
        const skel = document.getElementById('initSkeleton');
        if (skel) skel.remove();
    }

    // ── Typing reveal for bot messages ──
    function addMsgWithReveal(role, content, skipAnimation) {
        const d = document.createElement('div');
        d.className = `msg ${role}`;
        chat.insertBefore(d, typing);

        if (role === 'bot' && !skipAnimation) {
            // Character-by-character reveal
            let i = 0;
            const speed = Math.max(12, Math.min(30, 800 / content.length));
            function typeNext() {
                if (i < content.length) {
                    d.textContent = content.substring(0, i + 1);
                    i++;
                    if (isNearBottom) scrollToBottom();
                    requestAnimationFrame(() => setTimeout(typeNext, speed));
                } else {
                    addTimestamp(role);
                }
            }
            typeNext();
        } else {
            d.textContent = content;
            addTimestamp(role);
        }

        if (isNearBottom) scrollToBottom();
    }

    // Instant add (for loading history)
    function addMsg(role, content) {
        const d = document.createElement('div');
        d.className = `msg ${role}`;
        d.textContent = content;
        chat.insertBefore(d, typing);
        addTimestamp(role);
        scrollToBottom();
    }

    function addTimestamp(role) {
        const meta = document.createElement('div');
        meta.className = `msg-meta ${role === 'bot' ? 'bot-time' : 'user-time'}`;
        const timeStr = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
        if (role === 'user') {
            meta.innerHTML = `<span class="msg-time">${timeStr}</span><span class="msg-check"><i class="fa-solid fa-check-double"></i></span>`;
        } else {
            meta.innerHTML = `<span class="msg-time">${timeStr}</span>`;
        }
        chat.insertBefore(meta, typing);
    }

    // ── Refresh brain activity panel ──
    async function refreshLogs() {
        if (!contactId) return;

        try {
            const res = await fetch(`/get-logs?contact_id=${contactId}`);
            const data = await res.json();

            if (data.logs && data.logs.length > 0) {
                logs.innerHTML = '';

                data.logs.forEach(log => {
                    const entry = document.createElement('div');

                    let entryClass = 'log-entry';
                    if (log.type === 'Known Facts') {
                        entryClass += ' facts';
                    } else if (log.type === 'Full Human Identity Narrative') {
                        entryClass += ' narrative';
                    } else if (log.role === 'lead' || log.type?.includes('Lead')) {
                        entryClass += ' user';
                    } else if (log.role === 'bot' || log.type?.includes('Bot')) {
                        entryClass += ' bot';
                    }

                    entry.className = entryClass;

                    let timeStr = '';
                    if (log.timestamp) {
                        try {
                            const d = new Date(log.timestamp);
                            timeStr = d.toLocaleTimeString();
                        } catch (e) {
                            timeStr = log.timestamp;
                        }
                    }

                    entry.innerHTML = `
                        <div class="log-header">
                            <span class="log-type">${log.type || (log.role === 'lead' ? 'Lead Message' : 'Bot Message')}</span>
                            <span class="log-time">${timeStr}</span>
                        </div>
                        <div class="log-body">${escapeHtml(log.content || '')}</div>
                    `;

                    logs.appendChild(entry);
                });

                logs.scrollTop = logs.scrollHeight;
            }
        } catch (e) {
            console.error('Failed to refresh logs:', e);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ── Send message ──
    window.send = async function() {
        const text = input.value.trim();
        if (!text || sending) return;

        sending = true;
        sendBtn.disabled = true;

        addMsg('user', text);
        input.value = '';
        input.style.height = 'auto';

        typing.classList.add('active');
        scrollToBottom();

        try {
            const res = await fetch('/demo/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contact_id: contactId, message: text })
            });

            typing.classList.remove('active');
            const data = await res.json();

            if (data.reply) {
                addMsgWithReveal('bot', data.reply, false);
            }

            await refreshLogs();

        } catch (e) {
            typing.classList.remove('active');
            addMsg('bot', "Connection issue. Please try again.");
        }

        sending = false;
        sendBtn.disabled = false;
        input.focus();
    };

    // ── Custom confirm modal ──
    function showConfirm() {
        return new Promise((resolve) => {
            const modal = document.getElementById('confirmModal');
            modal.classList.add('active');
            const onOk = () => { cleanup(); resolve(true); };
            const onCancel = () => { cleanup(); resolve(false); };
            const cleanup = () => {
                modal.classList.remove('active');
                document.getElementById('confirmOk').removeEventListener('click', onOk);
                document.getElementById('confirmCancel').removeEventListener('click', onCancel);
            };
            document.getElementById('confirmOk').addEventListener('click', onOk);
            document.getElementById('confirmCancel').addEventListener('click', onCancel);
        });
    }

    // ── Reset session ──
    window.reset = async function() {
        const confirmed = await showConfirm();
        if (!confirmed) return;

        const overlay = document.getElementById('resetOverlay');
        overlay.style.display = 'flex';

        // Remove all messages but keep typing indicator and scroll fab
        Array.from(chat.children).forEach(child => {
            if (child.id !== 'typing' && child.id !== 'scrollFab') child.remove();
        });

        logs.innerHTML = '<div class="log-entry" style="border-left-color:#ffaa00;"><div class="log-body" style="color:#ffaa00;">> Resetting session...</div></div>';

        try {
            const res = await fetch('/demo/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contact_id: contactId })
            });

            const data = await res.json();
            contactId = data.contact_id;
            localStorage.setItem('demo_id', contactId);

            document.getElementById('sessionDisplay').innerText = contactId;
            document.getElementById('downloadLink').href = `/download-transcript?contact_id=${contactId}`;

            if (data.opener) {
                addMsgWithReveal('bot', data.opener, false);
            }

            await refreshLogs();

        } catch (e) {
            logs.innerHTML = '<div class="log-entry" style="border-left-color:#ff4444;"><div class="log-body" style="color:#ff4444;">> Reset failed. Please refresh page.</div></div>';
        } finally {
            overlay.style.display = 'none';
        }
    };

    // ── Initialize ──
    async function init() {
        // Clock
        const updateClock = () => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        };
        updateClock();
        setInterval(updateClock, 1000);

        // Input handling
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        // Send button click
        sendBtn.addEventListener('click', send);

        // Mobile keyboard handling — resize the whole page to match visual viewport
        // This prevents the black gap between content and keyboard
        if (window.visualViewport && window.innerWidth <= 900) {
            function handleViewportResize() {
                const vv = window.visualViewport;
                // Set body height to exactly the visual viewport (no gap)
                document.body.style.height = `${vv.height}px`;
                // Offset for iOS rubber-band scroll
                document.body.style.transform = `translateY(${vv.offsetTop}px)`;
                requestAnimationFrame(() => scrollToBottom());
            }
            window.visualViewport.addEventListener('resize', handleViewportResize);
            window.visualViewport.addEventListener('scroll', handleViewportResize);
        }

        // Show skeleton while loading
        showLoadingSkeleton();

        contactId = localStorage.getItem('demo_id');

        try {
            const res = await fetch('/demo/init', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: contactId ? contactId.replace('demo_', '') : null })
            });

            const data = await res.json();
            contactId = data.contact_id;
            localStorage.setItem('demo_id', contactId);

            document.getElementById('sessionDisplay').innerText = contactId;
            document.getElementById('downloadLink').href = `/download-transcript?contact_id=${contactId}`;

            removeLoadingSkeleton();

            if (data.history && data.history.length) {
                data.history.forEach(m => addMsg(m.role, m.content));
            } else if (data.opener) {
                addMsgWithReveal('bot', data.opener, false);
            }

            await refreshLogs();

        } catch (e) {
            removeLoadingSkeleton();
            logs.innerHTML = '<div class="log-entry" style="border-left-color:#ff4444;"><div class="log-body" style="color:#ff4444;">> Connection failed. Please refresh.</div></div>';
        }
    }

    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
