<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .expired { text-align: center; padding: 40px; }
        .expired-icon { font-size: 2.5rem; color: #444; margin-bottom: 16px; }
        .expired-title { font-size: 1.2rem; font-weight: 600; color: #aaa; margin-bottom: 8px; }
        .expired-sub { font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>
    <div class="expired">
        <div class="expired-icon">&#x1F517;</div>
        <div class="expired-title">This screen share has ended</div>
        <div class="expired-sub">The link has expired or the session is no longer active.</div>
    </div>
</body>
</html>
