    <!-- ════════════════════════════════════════════════
         DISCORD SERVER SELECTOR MODAL
         ════════════════════════════════════════════════ -->
    <div id="discordServerModal">
        <div class="discord-modal-card">
            <div class="discord-modal-title">
                <i class="fa-brands fa-discord discord-modal-icon"></i>Add a Discord Server
            </div>
            <div class="discord-modal-sub">Select a server to add. If the bot isn't there yet, click <strong class="discord-modal-emphasis">Invite Bot</strong> — once it joins, the server will be added automatically.</div>
            <div id="discordGuildList" class="discord-guild-list">
                <div class="discord-state-msg"><i class="fa-solid fa-spinner fa-spin"></i><span>Loading your servers…</span></div>
            </div>
            <div class="discord-modal-actions">
                <button class="discord-modal-close-btn" onclick="closeServerModal()">
                    Close
                </button>
            </div>
        </div>
    </div>
