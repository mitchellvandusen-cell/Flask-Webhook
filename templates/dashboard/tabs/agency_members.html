<!-- Agency Members Tab — Agency Owners Only -->
<div class="tab-pane fade" id="agency-members" role="tabpanel">

    <div class="vc-container">
        <div class="vc-status-bar">
            <i class="fa-solid fa-user-group"></i>
            <span>Agency Members</span>
        </div>
        <div class="am-body">
        <p class="am-desc">All agents linked to your agency. Members are auto-discovered when they connect their GHL account under your company.</p>

        <!-- Stats Row -->
        <div class="am-stats-row">
            <div class="am-stat-card">
                <div class="agency-stat-val" id="agencyMemberCount">&mdash;</div>
                <div class="agency-stat-lbl">Total Members</div>
            </div>
            <div class="am-stat-card">
                <div class="agency-stat-val" id="agencyActiveCount">&mdash;</div>
                <div class="agency-stat-lbl">Active</div>
            </div>
            <div class="am-stat-card">
                <div class="agency-stat-val" id="agencyPendingCount">&mdash;</div>
                <div class="agency-stat-lbl">Pending</div>
            </div>
        </div>

        <!-- Members Table -->
        <div class="table-responsive">
            <table class="table agency-members-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Plan</th>
                        <th>Status</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="agencyMembersBody">
                    <tr><td colspan="5" class="text-center dash-text-muted">Loading members...</td></tr>
                </tbody>
            </table>
        </div>
        </div><!-- /am-body -->
    </div>

</div>
