<!-- Agency Members Tab — Agency Owners Only -->
<div class="tab-pane fade" id="agency-members" role="tabpanel">

    <div class="config-panel vc-container">
        <h3 class="config-panel-title"><i class="fa-solid fa-user-group me-2"></i>Agency Members</h3>
        <p class="config-panel-desc">All agents linked to your agency. Members are auto-discovered when they connect their GHL account under your company.</p>

        <!-- Stats Row -->
        <div class="d-flex gap-3 flex-wrap mb-4">
            <div class="agency-stat-card vc-container">
                <div class="agency-stat-val" id="agencyMemberCount">—</div>
                <div class="agency-stat-lbl">Total Members</div>
            </div>
            <div class="agency-stat-card vc-container">
                <div class="agency-stat-val" id="agencyActiveCount">—</div>
                <div class="agency-stat-lbl">Active</div>
            </div>
            <div class="agency-stat-card vc-container">
                <div class="agency-stat-val" id="agencyPendingCount">—</div>
                <div class="agency-stat-lbl">Pending</div>
            </div>
        </div>

        <!-- Members Table -->
        <div class="table-responsive">
            <table class="table agency-members-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Plan</th>
                        <th>Status</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="agencyMembersBody">
                    <tr><td colspan="5" class="text-center dash-text-muted">Loading members...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
