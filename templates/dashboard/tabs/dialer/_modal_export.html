                            <div class="dlr-export-field-group">
                                <label class="dlr-export-label">Tags</label>
                                <div id="dlrExportTags" class="dlr-export-tags-wrap">

                                </div>
                            </div>

                            <div class="dlr-export-date-row">

                                    <input type="date" id="dlrExportDateFrom" class="dlr-export-input">

                                <div class="dlr-export-date-col">

                    </div>
