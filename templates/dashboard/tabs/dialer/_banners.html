                <style>
                    .dlr-banner-rotation { border-radius:10px; padding:12px 16px; margin-bottom:10px; }
                    .dlr-banner-rotation-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
                    .dlr-banner-rotation-icon i { font-size:0.9rem; }
                    .dlr-banner-rotation-body { flex:1; }
                    .dlr-banner-rotation-title { font-size:0.85rem; font-weight:700; }
                    .dlr-banner-rotation-sub { font-size:0.75rem; margin-top:2px; }
                    .dlr-banner-rotation-cta { padding:5px 14px; border-radius:6px; font-weight:700; font-size:0.75rem; text-decoration:none; white-space:nowrap; }
                    .dlr-banner-dismiss-btn { background:none; border:none; cursor:pointer; font-size:0.75rem; padding:4px; }
                    .dlr-banner-stats { border-radius:12px; padding:20px 24px; margin-bottom:12px; }
                    .dlr-banner-stats-title { margin:0; font-weight:700; font-size:1.1rem; }
                    .dlr-banner-stats-controls { display:flex; align-items:center; gap:8px; }
                    .dlr-banner-period-wrap { display:flex; gap:2px; border-radius:8px; padding:2px; }
                    .dlr-banner-period-btn { padding:4px 10px; border-radius:6px; border:none; font-size:0.78rem; font-weight:600; cursor:pointer; transition:all .15s; }
                    .dlr-banner-refresh-btn { border-radius:6px; padding:4px 8px; font-size:0.78rem; cursor:pointer; }
                    .dlr-banner-close-btn { background:none; border:none; cursor:pointer; font-size:1rem; }
                    .dlr-banner-stats-loading { text-align:center; padding:40px; }
                    .dlr-banner-stats-spinner { font-size:1.4rem; }
                    .dlr-banner-settings { border-radius:12px; padding:20px; margin-bottom:12px; }
                    .dlr-banner-settings-title { margin:0; font-weight:700; font-size:1rem; }
                    .dlr-banner-settings-icon-color { color:var(--accent); }
                    .dlr-banner-settings-inner { border-radius:10px; }
                    .dlr-banner-settings-arrow { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
                    .dlr-banner-settings-body { flex:1; }
                    .dlr-banner-settings-label { font-weight:600; font-size:0.88rem; }
                    .dlr-banner-settings-sub { font-size:0.78rem; margin-top:2px; }
                    .dlr-banner-settings-cta { border:none; border-radius:8px; padding:7px 16px; font-weight:700; font-size:0.82rem; cursor:pointer; white-space:nowrap; }
                    [data-theme="light"] .dlr-banner-settings-icon-color { color:var(--lt-accent, #059669); }
                </style>
                <!-- ═══ Number Rotation Feature Banner ═══ -->
                <div id="numberRotationBanner" class="dlr-banner-info-2 dlr-banner-rotation" style="display:none;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="dlr-icon-box-cyan-2 dlr-banner-rotation-icon">
                            <i class="fa-solid fa-shuffle dlr-icon-cyan-2"></i>
                        </div>
                        <div class="dlr-banner-rotation-body">
                            <div class="dlr-heading-2 dlr-banner-rotation-title">Smart Number Rotation is here</div>
                            <div class="dlr-label-muted-6 dlr-banner-rotation-sub">Health scoring, auto-rest, state geo-routing, and warm-up stages — all automatic. Enable it in <strong class="dlr-text-cyan">Numbers</strong> tab.</div>
                        </div>
                        <a href="#" onclick="event.preventDefault();sidebarNavigate('voice',document.getElementById('sbnVoiceConfig'));switchVoicePanel('numbers');" class="dlr-panel-cyan-4 dlr-banner-rotation-cta">
                            <i class="fa-solid fa-gear me-1"></i>Configure
                        </a>
                        <button onclick="this.closest('#numberRotationBanner').style.display='none';localStorage.setItem('nr_banner_dismissed','1');" class="dlr-btn-dismiss-3 dlr-banner-dismiss-btn"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <script>
                    (function(){if(!localStorage.getItem('nr_banner_dismissed')){document.getElementById('numberRotationBanner').style.display='block';}})();
                </script>

                <!-- ═══ Dialer Statistics Panel ═══ -->
                <div id="dialerStatsPanel" class="dlr-banner-stats" style="display:none;">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h6 class="dlr-heading-3 dlr-banner-stats-title"><i class="fa-solid fa-chart-bar me-2 dlr-text-cyan" ></i>Call Statistics</h6>
                        <div class="dlr-banner-stats-controls">
                            <!-- Period selector -->
                            <div class="dlr-panel-2 dlr-banner-period-wrap">
                                <button class="dlr-stat-period active dlr-btn-cyan-outline-2 dlr-banner-period-btn" data-period="today"  onclick="dialerSetStatsPeriod('today')">Today</button>
                                <button class="dlr-stat-period dlr-btn-tab-off-2 dlr-banner-period-btn"        data-period="week"   onclick="dialerSetStatsPeriod('week')">7 Days</button>
                                <button class="dlr-stat-period dlr-btn-tab-off-2 dlr-banner-period-btn"        data-period="month"  onclick="dialerSetStatsPeriod('month')">30 Days</button>
                                <button class="dlr-stat-period dlr-btn-tab-off-2 dlr-banner-period-btn"        data-period="all"    onclick="dialerSetStatsPeriod('all')">All Time</button>
                            </div>
                            <button onclick="dialerLoadStats()" class="dlr-btn-2 dlr-banner-refresh-btn" title="Refresh"><i class="fa-solid fa-arrows-rotate"></i></button>
                            <button onclick="dialerToggleStats()" class="dlr-btn-ghost-5 dlr-banner-close-btn"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <div id="dialerStatsContent">
                        <div class="dlr-misc-5 dlr-banner-stats-loading"><i class="fa-solid fa-spinner fa-spin dlr-icon-cyan-3 dlr-banner-stats-spinner"></i></div>
                    </div>
                </div>

                <!-- ═══ Dialer Settings Panel (redirects to Voice Config) ═══ -->
                <div id="dialerSettingsPanel" class="dlr-panel-8 dlr-banner-settings" style="display:none;">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h6 class="dlr-heading-4 dlr-banner-settings-title"><i class="fa-solid fa-sliders me-2 dlr-banner-settings-icon-color"></i>Dialer Settings</h6>
                        <button onclick="toggleDialerSettings()" class="dlr-btn-ghost-5 dlr-banner-close-btn"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="d-flex align-items-center gap-3 p-3 dlr-misc-6 dlr-banner-settings-inner">
                        <div class="dlr-icon-box-cyan-3 dlr-banner-settings-arrow">
                            <i class="fa-solid fa-arrow-right dlr-text-cyan" ></i>
                        </div>
                        <div class="dlr-banner-settings-body">
                            <div class="dlr-label dlr-banner-settings-label">All dialer settings have moved to Voice Config</div>
                            <div class="dlr-label-muted-7 dlr-banner-settings-sub">Dial attempts, recording, ring timeout, voicemail, VoIP setup, and more</div>
                        </div>
                        <button onclick="toggleDialerSettings();navTo('voice');setTimeout(()=>switchVoicePanel('dialer'),100);"
                            class="dlr-btn-cyan-4 dlr-banner-settings-cta">
                            <i class="fa-solid fa-sliders me-1"></i>Open Settings
                        </button>
                    </div>
                </div>

                <!-- ═══ Mobile Dialer Tab Switcher (hidden on desktop) ═══ -->
                <div class="dlr-mobile-tabs" id="dlrMobileTabs" style="display:none;">

                        <i class="fa-solid fa-address-book"></i> Contacts
                    </button>
                    <button class="dlr-mobile-tab" onclick="dlrMobileSwitch('intel', this)">
                        <i class="fa-solid fa-crosshairs"></i> Intel
                    </button>
                    <button class="dlr-mobile-tab" onclick="dlrMobileSwitch('phone', this)">
                        <i class="fa-solid fa-comment-dots"></i> Messages
                    </button>
                    <button class="dlr-mobile-tab" onclick="dlrMobileSwitch('calls', this)">
                        <i class="fa-solid fa-phone"></i> Calls
                    </button>
                </div>
