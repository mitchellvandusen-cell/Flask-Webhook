<!-- Agency KPIs Tab — Agency Owners Only -->
<div class="tab-pane fade" id="agency-kpis" role="tabpanel">

    <div class="config-panel glass-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="config-panel-title"><i class="fa-solid fa-chart-line me-2"></i>Agency Performance</h3>
                <p class="config-panel-desc mb-0">Aggregated KPIs across all your agents.</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm agency-period-btn active" onclick="agencyLoadKpis('today', this)">Today</button>
                <button class="btn btn-sm agency-period-btn" onclick="agencyLoadKpis('week', this)">Week</button>
                <button class="btn btn-sm agency-period-btn" onclick="agencyLoadKpis('month', this)">Month</button>
                <button class="btn btn-sm agency-period-btn" onclick="agencyLoadKpis('all', this)">All</button>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="agency-kpi-grid">
            <div class="agency-kpi-card glass-panel">
                <div class="agency-kpi-icon"><i class="fa-solid fa-phone"></i></div>
                <div class="agency-kpi-val" id="akTotalCalls">—</div>
                <div class="agency-kpi-lbl">Total Calls</div>
                <div class="agency-kpi-delta" id="akDeltaCalls"></div>
            </div>
            <div class="agency-kpi-card glass-panel">
                <div class="agency-kpi-icon"><i class="fa-solid fa-phone-flip"></i></div>
                <div class="agency-kpi-val" id="akConnected">—</div>
                <div class="agency-kpi-lbl">Connected</div>
                <div class="agency-kpi-delta" id="akDeltaConnected"></div>
            </div>
            <div class="agency-kpi-card glass-panel">
                <div class="agency-kpi-icon"><i class="fa-solid fa-percent"></i></div>
                <div class="agency-kpi-val" id="akConnectRate">—</div>
                <div class="agency-kpi-lbl">Connect Rate</div>
            </div>
            <div class="agency-kpi-card glass-panel">
                <div class="agency-kpi-icon"><i class="fa-solid fa-clock"></i></div>
                <div class="agency-kpi-val" id="akAvgDuration">—</div>
                <div class="agency-kpi-lbl">Avg Duration</div>
                <div class="agency-kpi-delta" id="akDeltaDuration"></div>
            </div>
            <div class="agency-kpi-card glass-panel">
                <div class="agency-kpi-icon"><i class="fa-solid fa-message"></i></div>
                <div class="agency-kpi-val" id="akMessages">—</div>
                <div class="agency-kpi-lbl">Messages</div>
            </div>
            <div class="agency-kpi-card glass-panel">
                <div class="agency-kpi-icon"><i class="fa-solid fa-users"></i></div>
                <div class="agency-kpi-val" id="akActiveAgents">—</div>
                <div class="agency-kpi-lbl">Active Agents</div>
            </div>
        </div>

        <!-- Agent Stats Table -->
        <h4 class="mt-4 mb-3 config-panel-title"><i class="fa-solid fa-ranking-star me-2"></i>Agent Breakdown</h4>
        <div class="table-responsive">
            <table class="table agency-members-table">
                <thead>
                    <tr>
                        <th>Agent</th>
                        <th>Calls</th>
                        <th>Connected</th>
                        <th>Talk Time</th>
                        <th>Avg Duration</th>
                        <th>Messages</th>
                    </tr>
                </thead>
                <tbody id="agencyAgentStatsBody">
                    <tr><td colspan="6" class="text-center dash-text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
