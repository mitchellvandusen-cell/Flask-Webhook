            <div class="tab-pane fade" id="logs" role="tabpanel">
                <div class="vc-container">
                    <!-- Header -->
                    <div class="vc-status-bar">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Activity Log</span>
                        <span class="vc-status-val" id="logsPageInfo"></span>
                    </div>

                    <!-- Filters -->
                    <div class="log-filters">
                        <div class="log-filter-group">
                            <label class="vc-label">Event Type</label>
                            <select id="logFilterType" class="vc-select" onchange="loadLogs()">
                                <option value="">All Events</option>
                                <option value="webhook_received">Webhook Received</option>
                                <option value="booking_attempt">Booking Attempt</option>
                                <option value="booking_success">Booking Success</option>
                                <option value="booking_failed">Booking Failed</option>
                                <option value="message_sent">Message Sent</option>
                                <option value="message_failed">Message Failed</option>
                                <option value="error">Errors</option>
                            </select>
                        </div>
                        <div class="log-filter-group">
                            <label class="vc-label">Status</label>
                            <select id="logFilterStatus" class="vc-select" onchange="loadLogs()">
                                <option value="">All Status</option>
                                <option value="success">Success</option>
                                <option value="error">Error</option>
                                <option value="warning">Warning</option>
                                <option value="info">Info</option>
                            </select>
                        </div>
                        <div class="log-filter-group log-filter-action">
                            <button class="vc-btn-secondary" onclick="loadLogs()">
                                <i class="fa-solid fa-rotate-right"></i> Refresh
                            </button>
                        </div>
                    </div>

                    <!-- Table header -->
                    <div class="log-table-header">
                        <span class="log-col-status">Status</span>
                        <span class="log-col-time">Time</span>
                        <span class="log-col-event">Event</span>
                        <span class="log-col-summary">Summary</span>
                        <span class="log-col-contact">Contact</span>
                    </div>

                    <!-- Log rows -->
                    <div id="logsContainer" class="log-table-body">
                        <div class="log-empty-state">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            <span>Loading logs...</span>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div class="log-pagination" id="logsPagination" style="display:none;">
                        <button class="vc-btn-secondary log-page-btn" id="logsOlder" onclick="loadLogs('older')">
                            <i class="fa-solid fa-arrow-left"></i> Older
                        </button>
                        <button class="vc-btn-secondary log-page-btn" id="logsNewer" onclick="loadLogs('newer')">
                            Newer <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
