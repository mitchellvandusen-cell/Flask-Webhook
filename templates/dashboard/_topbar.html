        <!-- ── Top Bar ── -->
        <div class="dash-topbar">
            <button class="mobile-menu-btn" onclick="mobileOpenSidebar()" title="Open menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div>
                <h1 id="dashPageTitle">Dialer</h1>
                <p class="dash-subtitle">InsuranceGrokBot Command Center</p>
            </div>
            <div class="dash-topbar-right">
                <div class="status-badge"><div class="dot"></div> <span>Active</span></div>

                <!-- Language Picker -->
                <div class="dropdown" style="display:inline-block;">
                    <button class="theme-toggle-btn" data-bs-toggle="dropdown" aria-expanded="false" title="Language">
                        <i class="fa-solid fa-globe"></i>
                        <span style="font-size:0.7rem;margin-left:2px;font-weight:700;">{{ lang|upper }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end glass-panel" style="min-width:140px;padding:8px;">
                        {% for code, name in SUPPORTED_LANGUAGES.items() %}
                        <li>
                            <a class="dropdown-item{% if code == lang %} active{% endif %}" href="#"
                               style="color:#ccc;font-size:0.85rem;{% if code == lang %}background:rgba(0,255,136,0.15);color:#00ff88;{% endif %}"
                               onclick="setLanguage('{{ code }}');return false;">
                                {{ name }}
                            </a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>

                <!-- Light / Dark Theme Toggle -->
                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Switch to light mode">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <div class="dash-user-pill">
                    <div class="dash-avatar">{{ current_user.email[0].upper() }}</div>
                    <span class="dash-user-email">{{ current_user.email }}</span>
                </div>
            </div>
        </div>
