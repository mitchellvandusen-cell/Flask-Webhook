    <style>
        /* Fix placeholder text visibility on dark backgrounds */
        .form-control::placeholder,
        textarea::placeholder,
        input::placeholder {
            color: rgba(255, 255, 255, 0.25) !important;
            opacity: 1 !important;
            font-weight: 400;
            letter-spacing: 0.01em;
            transition: opacity 0.15s;
        }
        /* Hide placeholder immediately on focus so it never overlaps typed text */
        .form-control:focus::placeholder,
        textarea:focus::placeholder,
        input:focus::placeholder {
            opacity: 0 !important;
            color: transparent !important;
        }
        input:focus { caret-color: #fff; }
        /* Dark theme for all select dropdowns */
        select option { background: #2a2a35; color: #fff; }
        /* Light theme overrides for placeholders and selects */
        body.light-theme .form-control::placeholder,
        body.light-theme textarea::placeholder,
        body.light-theme input::placeholder {
            color: #a0aec0 !important;
        }
        body.light-theme select option { background: #fff !important; color: #1a1a2e !important; }
        /* Pulsing green border glow for fields that need attention */
        @keyframes pulse-green {
            0%, 100% {
                border-color: rgba(0, 255, 136, 0.25);
                box-shadow: 0 0 3px rgba(0, 255, 136, 0.1);
            }
            50% {
                border-color: rgba(0, 255, 136, 0.6);
                box-shadow: 0 0 6px rgba(0, 255, 136, 0.2);
            }
        }
        /* wrapper gets no extra border — glow only on inner controls */
        .field-needs-attention .form-control {
            animation: pulse-green 2s ease-in-out infinite;
            border: 1px solid rgba(0, 255, 136, 0.25) !important;
        }
        /* for tech-readout blocks (readonly display fields) the div IS the control */
        .tech-readout.field-needs-attention {
            animation: pulse-green 2s ease-in-out infinite;
            border: 1px solid rgba(0, 255, 136, 0.25) !important;
        }

        /* Pulsing Connect button */
        @keyframes pulse-connect {
            0%, 100% {
                box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 4px 25px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 255, 136, 0.15);
                transform: scale(1.02);
            }
        }
        .connect-btn-pulse {
            animation: pulse-connect 2s ease-in-out infinite;
        }

        /* Congratulations overlay */
        .congrats-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .congrats-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .congrats-card {
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 255, 136, 0.08);
            position: relative;
            overflow: hidden;
        }
        .congrats-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .congrats-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(0, 255, 136, 0.2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .congrats-icon i {
            font-size: 2rem;
            color: var(--accent);
        }
        .congrats-btn {
            display: inline-block;
            background: var(--accent);
            color: #000;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 15px 40px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2);
            text-decoration: none;
            margin-top: 8px;
        }
        .congrats-btn:hover {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.35);
        }
        .congrats-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none; border: none;
            color: #666;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .congrats-close:hover { color: #fff; }

        /* Workflow tab styles */
        .workflow-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .workflow-tab-btn {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #888;
            font-weight: 600;
            font-size: var(--fs-base);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .workflow-tab-btn:hover { border-color: rgba(255, 255, 255, 0.15); color: #bbb; }
        .workflow-tab-btn.active {
            background: rgba(0, 255, 136, 0.06);
            border-color: rgba(0, 255, 136, 0.2);
            color: var(--accent);
        }
        .workflow-content { display: none; }
        .workflow-content.active { display: block; }
        .wf-step {
            display: flex;
            gap: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            align-items: flex-start;
        }
        .wf-step-num {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.15);
            color: var(--accent);
            font-weight: 800;
            font-size: var(--fs-sm);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .wf-step-text {
            color: #ccc;
            font-size: var(--fs-base);
            line-height: var(--lh-normal);
        }
        .wf-step-text strong { color: #fff; }

        /* Smart Tags guide */
        .wf-tag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
        }
        .wf-tag-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 18px;
        }
        .wf-tag-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .wf-tag-header i { font-size: 0.95rem; }
        .wf-tag-name {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .wf-tag-fresh .wf-tag-header { color: #00ff88; }
        .wf-tag-fresh { border-color: rgba(0,255,136,0.12); }
        .wf-tag-aged .wf-tag-header { color: #ffa726; }
        .wf-tag-aged { border-color: rgba(255,167,38,0.12); }
        .wf-tag-reengage .wf-tag-header { color: #42a5f5; }
        .wf-tag-reengage { border-color: rgba(66,165,245,0.12); }
        .wf-tag-desc {
            color: #999;
            font-size: var(--fs-base);
            line-height: var(--lh-normal);
            margin-bottom: 14px;
        }
        .wf-tag-detail {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .wf-tag-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            font-size: var(--fs-sm);
        }
        .wf-tag-detail-label { color: #666; }
        .wf-tag-detail-val { color: #bbb; font-weight: 600; }
        .wf-tag-detail-val.wf-tag-yes { color: #00ff88; }
        .wf-tag-detail-val.wf-tag-warn { color: #ffa726; }
        .wf-date-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
        }
        .wf-date-range { color: #888; font-size: var(--fs-sm); font-weight: 600; }
        .wf-date-type { font-size: var(--fs-sm); font-weight: 700; }
        .wf-cf-chip {
            background: rgba(156,39,176,0.08);
            border: 1px solid rgba(156,39,176,0.2);
            color: #ce93d8;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: var(--fs-sm);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Logs tab */
        .log-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: var(--fs-base);
            transition: background 0.2s;
        }
        .log-row:hover { background: rgba(255,255,255,0.03); }
        .log-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: var(--fs-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 60px;
            text-align: center;
            flex-shrink: 0;
        }
        .log-badge.success { background: rgba(0,255,136,0.15); color: #00ff88; }
        .log-badge.error { background: rgba(239,68,68,0.15); color: #ef4444; }
        .log-badge.warning { background: rgba(255,193,7,0.15); color: #ffc107; }
        .log-badge.info { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .log-time { color: #666; font-family: 'JetBrains Mono', monospace; font-size: var(--fs-sm); min-width: 140px; flex-shrink: 0; }
        .log-event { color: #888; font-family: 'JetBrains Mono', monospace; font-size: var(--fs-sm); min-width: 130px; flex-shrink: 0; }
        .log-summary { color: #ccc; flex: 1; }
        .log-contact { color: #666; font-family: 'JetBrains Mono', monospace; font-size: var(--fs-xs); }

        /* Connect tab */
        .crm-select-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 8px;
            font-size: var(--fs-base);
            transition: all 0.3s;
        }
        .crm-select-btn:hover { border-color: var(--accent); color: #fff; background: rgba(0,255,136,0.05); }
        .crm-select-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,136,0.1); box-shadow: 0 0 20px rgba(0,255,136,0.1); }
        .setup-steps { margin-top: 16px; }
        .crm-guide { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .log-time, .log-event { display: none; }
            .log-row { font-size: 0.8rem; padding: 8px; }
        }

        /* ═══ MOBILE RESPONSIVE ═══ */

        /* -- Tablet (≤992px) -- */
        @media (max-width: 992px) {
            .glass-panel { padding: 20px !important; }
        }

        /* -- Mobile (≤768px) -- */
        @media (max-width: 768px) {
            /* Main nav tabs: horizontal scroll instead of wrapping */
            #dashTabs {
                flex-wrap: nowrap !important;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                gap: 4px !important;
                margin-bottom: 20px !important;
                padding-bottom: 2px;
            }
            #dashTabs::-webkit-scrollbar { display: none; }
            #dashTabs .nav-link {
                font-size: 0.72rem !important;
                padding: 8px 10px !important;
                white-space: nowrap;
            }
            /* Hide tab label text, show only icons on small screens */
            #dashTabs .nav-link { font-size: 0 !important; }
            #dashTabs .nav-link i { font-size: 0.9rem !important; margin: 0 !important; }

            /* Glass panels: clean cards */
            .glass-panel { padding: 14px !important; border-radius: 14px !important; }

            /* Voice sub-tabs: smaller on mobile */
            .voice-stab-btn {
                padding: 6px 10px !important;
                font-size: 0.72rem !important;
            }

            /* Voice Dialer: stack columns vertically */
            .dlr-3col-layout {
                flex-direction: column !important;
                height: auto !important;
                min-height: unset !important;
            }
            .dlr-3col-layout > .dlr-col {
                width: 100% !important;
                max-height: 350px;
            }
            /* Dialer top bar: wrap items */
            .dlr-top-bar {
                flex-wrap: wrap !important;
                gap: 8px !important;
            }
            .dlr-top-bar .quick-dial-group { max-width: 100% !important; flex: 1 1 100% !important; }

            /* Numbers table: responsive grid */
            .numbers-grid-header,
            .numbers-grid-row {
                grid-template-columns: 1fr 80px 40px !important;
            }
            .numbers-col-sms,
            .numbers-col-cnam,
            .numbers-col-menu { display: none !important; }

            /* Trust Hub number health grid */
            .trust-health-header,
            .trust-health-row {
                grid-template-columns: 1fr auto !important;
            }
            .trust-col-cnam,
            .trust-col-health { display: none !important; }

            /* How It Works: 2 columns */
            .voice-how-it-works .col-md-3 {
                flex: 0 0 50% !important;
                max-width: 50% !important;
            }

            /* Congrats overlay */
            .congrats-card { padding: 30px 20px !important; }
            .congrats-icon { width: 60px !important; height: 60px !important; }

            /* CRM guide steps */
            .wf-step { flex-direction: column; align-items: flex-start; }

            /* Forms: full width */
            .form-control, .form-select, input[type="text"], input[type="url"], textarea, select {
                font-size: 16px !important; /* Prevents iOS zoom on focus */
            }

            /* Carrier grid: single column */
            #carrierGrid {
                grid-template-columns: 1fr !important;
                max-height: 300px !important;
            }

            /* Stack col-md-6 columns on phone screens */
            .row.g-3 > [class*="col-md-"],
            .row.g-4 > [class*="col-md-"] {
                flex: 0 0 100% !important;
                max-width: 100% !important;
            }

            /* Workflow tab: full-width buttons */
            .workflow-tab-btn { font-size: 0.78rem !important; padding: 8px 12px !important; }

            /* AI Minutes packages: stack */
            .ai-minutes-pkg-grid { grid-template-columns: 1fr !important; }

            /* Billing cards */
            .billing-card-grid { grid-template-columns: 1fr !important; }
        }

        /* -- Small mobile (≤480px) -- */
        @media (max-width: 480px) {
            /* Voice sub-tabs: icon only */
            .voice-stab-btn {
                padding: 6px 8px !important;
                font-size: 0 !important;
            }
            .voice-stab-btn i { font-size: 0.85rem !important; margin: 0 !important; }

            /* Stack flex layouts vertically */
            .mobile-stack {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .mobile-stack > * { width: 100% !important; min-width: unset !important; }

            /* Tighter glass panels */
            .glass-panel { padding: 12px !important; }

            /* Save overlay */
            .save-overlay-box { padding: 24px 20px !important; }

            /* Webhook URL section */
            .webhook-url-group {
                flex-direction: column !important;
            }
            .webhook-url-group > div { min-width: unset !important; width: 100% !important; }

            /* Row g-3 columns stack */
            .row.g-3 > [class*="col-md-"] {
                flex: 0 0 100% !important;
                max-width: 100% !important;
            }
        }

        /* Save overlay */
        .save-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .save-overlay.active { display: flex; }
        .save-overlay-box {
            background: var(--card-glass, #1a1a2e);
            border: 1px solid var(--glass-border, rgba(255,255,255,0.08));
            border-radius: 20px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .save-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent, #00ff88);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .save-check {
            display: none;
            font-size: 2.5rem;
            color: var(--accent, #00ff88);
            margin-bottom: 12px;
        }
        .save-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #fff;
        }

        /* Persistent alert banners */
        .persistent-alert {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid;
            position: relative;
        }
        .persistent-alert.alert-warning-persistent {
            background: rgba(255, 193, 7, 0.08);
            border-color: rgba(255, 193, 7, 0.3);
        }
        .persistent-alert.alert-error-persistent {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .persistent-alert.alert-info-persistent {
            background: rgba(59, 130, 246, 0.08);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .persistent-alert .pa-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .alert-warning-persistent .pa-icon { color: #ffc107; }
        .alert-error-persistent .pa-icon { color: #ef4444; }
        .alert-info-persistent .pa-icon { color: #3b82f6; }
        .persistent-alert .pa-body { flex: 1; }
        .persistent-alert .pa-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        .alert-warning-persistent .pa-title { color: #ffc107; }
        .alert-error-persistent .pa-title { color: #ef4444; }
        .alert-info-persistent .pa-title { color: #3b82f6; }

            font-size: 0.88rem;
            color: #bbb;
            line-height: 1.5;
        }

            position: absolute;
            top: 12px; right: 14px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .persistent-alert .pa-dismiss:hover { color: #fff; }
        .persistent-alert .pa-time {
            font-size: 0.75rem;
            color: #666;
            margin-top: 6px;
        }

        /* Onboarding issue banner */
        .onboarding-banner {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.12) 0%, rgba(255, 193, 7, 0.08) 100%);
            border: 1px solid rgba(255, 152, 0, 0.35);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .onboarding-banner .banner-icon {
            font-size: 1.5rem;
            color: #ff9800;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .onboarding-banner .banner-body h4 {
            font-size: 1rem;

        #slackMessages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 4px; }

        /* Slack message groups */
        .slack-msg {
            display: flex; gap: 14px;
            padding: 2px 18px; border-radius: 0;
            transition: background 0.08s;
            position: relative;
        }
        .slack-msg:hover { background: rgba(255,255,255,0.025); }
        .slack-msg.group-start { padding-top: 14px; }
        .slack-msg-avatar-wrap {
            width: 38px; flex-shrink: 0;
            display: flex; align-items: flex-start; padding-top: 2px;
        }
        .slack-msg-avatar {
            width: 38px; height: 38px; border-radius: 6px;
            object-fit: cover;
            background: rgba(54, 197, 240, 0.2);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.85rem; color: #36c5f0;
            overflow: hidden; flex-shrink: 0;
        }
        .slack-msg.continued .slack-msg-avatar { visibility: hidden; }
        .slack-msg.continued .slack-msg-meta { display: none; }
        .slack-msg-hover-time {
            display: none; position: absolute;
            left: 20px; top: 50%; transform: translateY(-50%);
            font-size: 0.75rem; color: #444;
            white-space: nowrap;
        }
        .slack-msg.continued:hover .slack-msg-hover-time { display: block; }
        .slack-msg-body { flex: 1; min-width: 0; }
        .slack-msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
        .slack-msg-author { font-weight: 700; font-size: 0.92rem; color: #fff; }
        .slack-msg-author.is-self { color: #36c5f0; }
        .slack-msg-time { font-size: 0.7rem; color: #444; }
        .slack-msg-text {
            font-size: 0.915rem; color: #d4d7dc;
            line-height: 1.55; word-break: break-word;
        }
        .slack-msg.new-msg { animation: msgSlideIn 0.22s ease; }

        /* Slack scroll-to-bottom button */
        #slackScrollBtn {
            position: absolute; bottom: 80px; right: 18px;
            width: 36px; height: 36px; border-radius: 50%;
            background: #36c5f0; border: none; color: #fff;
            display: none; align-items: center; justify-content: center;
            font-size: 0.9rem; cursor: pointer; z-index: 10;
            box-shadow: 0 4px 16px rgba(54,197,240,0.4);
            transition: transform 0.15s, opacity 0.2s;
        }
        #slackScrollBtn.visible { display: flex; }
        #slackScrollBtn:hover { transform: scale(1.1); }

        /* Slack composer */
        .slack-composer {
            padding: 10px 16px 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0; background: #0d0d14;
        }
        .slack-composer-inner {
            display: flex; gap: 0; align-items: flex-end;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .slack-composer-inner:focus-within {
            border-color: rgba(54,197,240,0.45);
            box-shadow: 0 0 0 3px rgba(54,197,240,0.08);
        }
        #slackReplyText {
            flex: 1; background: none; border: none; outline: none;
            color: #dcddde; font-size: 0.92rem; resize: none;
            line-height: 1.5; max-height: 120px; min-height: 22px;
            font-family: 'Outfit', sans-serif;
            padding: 10px 12px;
        }
        #slackReplyText::placeholder { color: rgba(255,255,255,0.22); }
        .slack-send-btn {
            background: #36c5f0; border: none; color: #fff;
            width: 42px; padding: 0;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 0.9rem;
            transition: background 0.2s;
            align-self: stretch; flex-shrink: 0;
        }
        .slack-send-btn:hover { background: #2eb0d7; }
        .slack-send-btn:disabled { background: rgba(54,197,240,0.28); cursor: not-allowed; }
        .slack-composer-hint {
            font-size: 0.75rem; color: #3a3d4a; margin-top: 5px; padding: 0 4px;
        }

        /* Slack empty / loading states */
        .slack-state-msg {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; padding: 48px 24px;
            color: #444; font-size: 0.9rem; text-align: center;
            flex: 1;
        }
        .slack-state-msg .state-icon {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(54,197,240,0.08);
            border: 1px solid rgba(54,197,240,0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #2d7a8c;
        }
        .slack-state-msg .state-title { font-weight: 700; color: #666; font-size: 0.95rem; }
        .slack-state-msg .state-sub { font-size: 0.82rem; color: #3a3d4a; max-width: 260px; line-height: 1.5; }

        /* Slack markdown styles */
        .slk-code-block {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px; padding: 8px 10px; font-size: 0.82rem;
            overflow-x: auto; margin: 4px 0; font-family: 'JetBrains Mono', monospace;
            color: #d4d7dc;
        }
        .slk-inline-code {
            background: rgba(54,197,240,0.1); border: 1px solid rgba(54,197,240,0.15);
            border-radius: 3px; padding: 1px 5px; font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .slk-blockquote {
            border-left: 3px solid rgba(54,197,240,0.4);
            padding: 2px 10px; margin: 4px 0; color: #999;
        }
        .slk-link { color: #36c5f0; text-decoration: none; }
        .slk-link:hover { text-decoration: underline; }
        .slk-reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
        .slk-reaction {
            background: rgba(54,197,240,0.08); border: 1px solid rgba(54,197,240,0.15);
            border-radius: 12px; padding: 2px 6px; font-size: 0.75rem;
            display: flex; align-items: center; gap: 4px;
        }
        .slk-reaction-emoji { font-size: 0.8rem; }
        .slk-reaction-count { font-size: 0.7rem; color: #888; }
        .slk-attachment { margin-top: 4px; }
        .slk-attachment-img { max-width: 280px; max-height: 200px; border-radius: 8px; cursor: pointer; }
        .slk-attachment-file {
            display: flex; align-items: center; gap: 6px; padding: 6px 10px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; font-size: 0.82rem;
        }

        /* Advanced Settings Toggle Switch */
        .adv-toggle { position: relative; display: inline-block; width: 48px; height: 26px; flex-shrink: 0; }
        .adv-toggle input { opacity: 0; width: 0; height: 0; }
        .adv-toggle-slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.1); border-radius: 26px; transition: 0.3s;
        }
        .adv-toggle-slider:before {
            content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background: #666; border-radius: 50%; transition: 0.3s;
        }
        .adv-toggle input:checked + .adv-toggle-slider { background: rgba(0,255,136,0.25); }
        .adv-toggle input:checked + .adv-toggle-slider:before { transform: translateX(22px); background: var(--accent); }

        /* ── Discord Markdown ──────────────────────────────────────────────── */
        .dc-code-block {
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 4px;
            padding: 8px 12px;
            font-family: 'Consolas','Courier New',monospace;
            font-size: 0.81rem;
            color: #d4d4d4;
            overflow-x: auto;
            white-space: pre;
            margin: 4px 0;
            display: block;
        }
        .dc-code-block code { background: none; border: none; padding: 0; }
        .dc-inline-code {
            background: rgba(0,0,0,0.4);
            border-radius: 3px;
            padding: 1px 5px;
            font-family: 'Consolas','Courier New',monospace;
            font-size: 0.85em;
            color: #e3e5e8;
        }
        .dc-blockquote {
            border-left: 3px solid #4f545c;
            padding-left: 10px;
            margin: 2px 0;
            color: #dcddde;
        }
        .dc-link { color: #00aff4; text-decoration: none; }
        .dc-link:hover { text-decoration: underline; }
        .dc-spoiler {
            background: #202225;
            color: #202225;
            border-radius: 3px;
            cursor: pointer;
            padding: 1px 4px;
            transition: background 0.15s, color 0.15s;
        }
        .dc-spoiler.revealed { background: rgba(255,255,255,0.08); color: inherit; }

        /* ── Reply reference ───────────────────────────────────────────────── */
        .dc-reply-ref {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
            font-size: 0.75rem;
            color: #72767d;
            overflow: hidden;
        }
        .dc-reply-ref i { color: #7289da; flex-shrink: 0; font-size: 0.75rem; }
        .dc-reply-ref strong { color: #b9bbbe; white-space: nowrap; }
        .dc-reply-ref span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── Reactions ─────────────────────────────────────────────────────── */
        .dc-reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
        .dc-reaction {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 0.78rem;
            cursor: default;
            transition: background 0.15s;
        }
        .dc-reaction:hover { background: rgba(114,137,218,0.2); }
        .dc-reaction-emoji { font-size: 0.95rem; line-height: 1; }
        .dc-reaction-count { color: #b9bbbe; font-size: 0.75rem; }

        /* ── Attachments ───────────────────────────────────────────────────── */
        .dc-attachment { margin-top: 5px; }
        .dc-attachment-img {
            max-width: 280px;
            max-height: 180px;
            border-radius: 6px;
            cursor: zoom-in;
            object-fit: contain;
            background: rgba(0,0,0,0.2);
            display: block;
        }
        .dc-attachment-file {
            font-size: 0.82rem;
            color: #b9bbbe;
            background: rgba(0,0,0,0.25);
            border-radius: 4px;
            padding: 5px 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* ── Toast ─────────────────────────────────────────────────────────── */
        .dc-toast {
            position: absolute;
            bottom: 76px;
            left: 12px;
            right: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            z-index: 200;
            pointer-events: none;
            animation: dcFadeUp 0.2s ease;
        }
        .dc-toast-error { background: rgba(237,66,69,0.92); color: #fff; }
        .dc-toast-warn  { background: rgba(240,165,0,0.92);  color: #fff; }
        @keyframes dcFadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Channel error / reconnect ─────────────────────────────────────── */
        .dc-ch-error {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 12px 10px;
            font-size: 0.78rem;
            color: #aaa;
            line-height: 1.45;
        }
        .dc-reconnect-btn {
            display: inline-flex;
            align-items: center;
            margin-top: 2px;
            padding: 5px 10px;
            background: #5865f2;
            color: #fff !important;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none !important;
            transition: background 0.15s;
            width: fit-content;
        }
        .dc-reconnect-btn:hover { background: #4752c4; }
        .dc-bot-hint {
            font-size: 0.75rem;
            color: #666;
            line-height: 1.5;
        }
        .dc-bot-hint code {
            background: rgba(255,255,255,0.06);
            padding: 1px 4px;
            border-radius: 3px;
            font-family: monospace;
            color: #00ff88;
        }
